<noscript><main style="max-width:640px;padding:40px;line-height:1.6"><h1>Muhammed Egemen Geyik</h1><p>Muhammed Egemen Geyik'in kişisel sitesi: TEDx sahnesinde &quot;İnovasyon&quot; üzerine yaptığı konuşma, web siteleri, tarayıcı eklentileri ve sunucu altyapısı alanındaki yazılım projeleri ve iletişim bilgileri.</p><ul><li><a href="https://www.ted.com/talks/muhammed_egemen_geyik_inovasyon">TED sayfası</a></li><li><a href="https://www.youtube.com/watch?v=BgNjGG_GllA">YouTube</a></li><li><a href="https://www.facebook.com/adiyamanmem/posts/tedxin-en-k%C3%BC%C3%A7%C3%BCk-konu%C5%9Fmac%C4%B1s%C4%B1-muhammed-egemen-geyik-kendisinin-yapt%C4%B1%C4%9F%C4%B1-oyuncak-ara/150071992387567/">Facebook paylaşımı</a></li><li><a href="https://github.com/egemngyk">GitHub</a></li></ul></main></noscript>
<!-- SEO-NOSCRIPT:END -->

<script type="module">
  import { getActiveTheme } from "/firebase/firebase.js";
  import { loadSeoConfig, applySeo, injectTedx } from "/shared/seo.mjs";

  const DEFAULT_THEME = "claudemade";

  // document.write head'i sileceği için ham sayfadaki SEO etiketlerini yedekle (config okunamazsa kullanılır)
  const shellSeoHTML = [...document.head.querySelectorAll("[data-seo]")]
    .map((el) => el.outerHTML)
    .join("\n");

  let seo = null;
  try {
    seo = await loadSeoConfig();
  } catch (err) {
    console.warn("[index] SEO config okunamadı, ham etiketler kullanılacak:", err.message);
  }

  function finalizeSeo() {
    if (seo) {
      applySeo(seo);
      injectTedx(seo);
    } else {
      document.head.insertAdjacentHTML("beforeend", shellSeoHTML);
    }
  }

  function setFavicon(theme) {
    setTimeout(() => {
      document.querySelectorAll("link[rel~='icon']").forEach((e) => e.remove());
      const iconLink = document.createElement("link");
      iconLink.rel = "shortcut icon";
      iconLink.type = "image/png";
      iconLink.href = `/themes/${theme}/assets/favicon.png?v=${Date.now()}`;
      document.head.appendChild(iconLink);
    }, 50);
  }

  async function showTheme(theme) {
    const res = await fetch(`/themes/${theme}/html/index.html`);
    if (!res.ok) throw new Error(`Tema bulunamadı: ${theme}`);
    const html = await res.text();

    document.open();
    document.write(html);
    document.close();

    finalizeSeo();
    setFavicon(theme);
  }

  async function loadTheme() {
    let theme = DEFAULT_THEME;

    try {
      theme = await getActiveTheme();
    } catch (err) {
      console.warn("[index] Tema alınamadı, varsayılan kullanılıyor:", err.message);
    }

    // Geçerli bir tema klasör adı mı kontrol et
    if (!theme || !/^[\w-]+$/.test(theme)) {
      theme = DEFAULT_THEME;
    }

    try {
      await showTheme(theme);
    } catch (err) {
      console.error("[index] Tema yüklenemedi:", err.message);

      // Fallback: default temayı dene
      if (theme !== DEFAULT_THEME) {
        try {
          await showTheme(DEFAULT_THEME);
        } catch {
          document.body.innerHTML = `
            <div style="text-align:center;padding:40px">
              <p style="color:#666">Tema yüklenemedi. Lütfen daha sonra tekrar deneyin.</p>
            </div>
          `;
        }
      }
    }
  }

  loadTheme();
</script>
